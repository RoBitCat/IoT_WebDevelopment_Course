        <h1>1. Implement a function that checks the correctness of the personal identity number.</h1>
        <p>Input data bellow</p>
        <input id="id1" type="text" placeholder="Insert PIC" oninput="idCheck('id1')">
        <p id="idOut1">Output:</p>

        <script>
            function idCheck(inputId){
                const out = document.getElementById('idOut1');
                const value = document.getElementById(inputId).value.trim(); // Trim removes whitespace

                const dd = value.substring(0, 2);
                const mm = value.substring(2, 4);
                const yy = value.substring(4, 6);
                const sep = value.charAt(6);
                const id = value.substring(7, 10);
                const ctrlChar = value.substring(10);

                const day = parseInt(dd, 10);
                const month = parseInt(mm, 10);
                const year = parseInt(yy, 10);
                let fullYear;
                let sex;

                

                // Full year
                if (sep === '+') {
                    fullYear = 1800 + year
                } else if (sep === '-' || sep === 'Y') {
                    fullYear = 1900 + year
                } else if (sep === 'A') {
                    fullYear = 2000 + year
                }
                
                // Checks 
                if (!value) { 
                    out.textContent = 'Output:'; 
                    return; 
                }

                if (value.length > 11) { 
                    out.textContent = 'Is valid: false, expected 11 characters'; 
                    return; 
                }

                if (value.length < 11) { 
                    out.textContent = 'Is valid: false, expected 11 characters'; 
                    return; 
                }

                // If value isn't int
                if (isNaN(day) || isNaN(month) || isNaN(year)) {
                    out.textContent = 'Is valid: false, day, month or year is not numeric';
                    return;
                }

                // individual number checker
                if (isNaN(id) || id.length !== 3 || id.includes('+') || id.includes('-')) {
                    out.textContent = 'Is valid: false, individual number must be 3 numeric characters';
                    return;
                }

                // Checks month
                if (month < 1 || month > 12) {
                    out.textContent = 'Is valid: false, invalid month';
                    return;
                }

                // Validate day by month
                if (['01','03','05','07','08','10','12'].includes(mm)) {
                    if (day < 1 || day > 31) { out.textContent = 'Is valid: false, invalid day'; return; }
                } else if (['04','06','09','11'].includes(mm)) {
                    if (day < 1 || day > 30) { out.textContent = 'Is valid: false, invalid day'; return; }
                } else { // February
                    if ((fullYear % 4 === 0) && (fullYear % 100 !== 0) || fullYear % 400 === 0) {
                        if (day < 1 || day > 29) { out.textContent = 'Is valid: false, invalid day for February'; return; }
                    } else {
                        if (day < 1 || day > 28) { out.textContent = 'Is valid: false, invalid day for February'; return; }
                    }
                }

                

                // Check for sex
                if (id%2 === 1) {
                    sex = 'Male'
                } else {
                    sex = 'Female'
                }


                
                // Age calculations
                const now = new Date();
                const curYear = now.getFullYear();
                const curMonth = now.getMonth() + 1; // getMonth() is 0-indexed
                const curDay = now.getDate();
                let ageYY = curYear - fullYear;
                let ageMM = curMonth - month;
                let ageDD = curDay - day;

                // if all passes
                out.innerHTML = 
                `
                Is valid: true <br>
                Sex: ${sex} <br>
                Age: ${ageYY} <br> (${ageYY} years ${ageMM} months ${ageDD} days) Calculated at ${curYear}.${curMonth}.${curDay}
                `;
                
            }
        </script>
